<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="loading" class="center">Загружаю…</div>

<div id="app" hidden>
  <main id="screen-today" class="screen">
    <section class="ring-card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-center">
          <div id="kcal-left" class="kcal-value">—</div>
          <div class="kcal-label">ккал осталось</div>
        </div>
      </div>
      <div id="kcal-sub" class="muted"></div>
    </section>

    <section class="macros">
      <div class="macro"><span class="macro-name">Белки</span>
        <div class="bar"><i id="bar-p"></i></div><span id="val-p" class="macro-val">—</span></div>
      <div class="macro"><span class="macro-name">Жиры</span>
        <div class="bar"><i id="bar-f"></i></div><span id="val-f" class="macro-val">—</span></div>
      <div class="macro"><span class="macro-name">Углеводы</span>
        <div class="bar"><i id="bar-c"></i></div><span id="val-c" class="macro-val">—</span></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>💧 Вода</h2><span id="water-val" class="muted"></span></div>
      <div class="bar big"><i id="bar-water"></i></div>
      <div class="row">
        <button class="chip" data-water="250">🥛 250</button>
        <button class="chip" data-water="350">☕ 350</button>
        <button class="chip" data-water="500">🍶 500</button>
        <button class="chip ghost" id="water-undo">↩︎</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Съедено сегодня</h2></div>
      <div id="meals"></div>
      <p class="hint">Чтобы добавить — пришли фото или голосовое боту в чат.</p>
    </section>
  </main>

  <main id="screen-pills" class="screen" hidden>
    <section class="card">
      <div class="card-head"><h2>Приём на сегодня</h2></div>
      <div id="pills"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Добавить препарат</h2></div>
      <input id="pill-name" class="input" placeholder="Например: Витамин D">
      <input id="pill-dose" class="input" placeholder="Дозировка: 5000 МЕ">
      <select id="pill-schedule" class="input">
        <option value="daily">Каждый день</option>
        <option value="weekdays">По дням недели</option>
        <option value="interval">Раз в несколько дней</option>
      </select>
      <div id="weekday-picker" class="row wrap" hidden></div>
      <input id="pill-interval" class="input" type="number" min="2" max="90"
             placeholder="Раз в сколько дней (например, 7)" hidden>
      <input id="pill-time" class="input" type="time" placeholder="Напоминание">
      <button id="pill-add" class="btn">Добавить</button>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-screen="today">📊 Сегодня</button>
    <button class="tab" data-screen="pills">💊 Добавки</button>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
