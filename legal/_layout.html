<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: #0A0912; color: #EDEAFB;
    font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  .eyebrow {
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: #C9A961; font-weight: 600;
  }
  h1 { font-size: 26px; line-height: 1.25; margin: 10px 0 6px; font-weight: 700; }
  .updated { font-size: 12px; color: #9C96C4; margin-bottom: 28px; }
  h2 {
    font-size: 16px; margin: 30px 0 10px; font-weight: 700;
    padding-top: 20px; border-top: 1px solid #2B2748;
  }
  h3 { font-size: 14px; margin: 20px 0 8px; font-weight: 600; }
  p, li { color: #D6D2EC; }
  ul, ol { padding-left: 22px; }
  li { margin: 6px 0; }
  a { color: #C4B5FD; }
  strong { color: #EDEAFB; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #2B2748; vertical-align: top; }
  th { color: #9C96C4; font-weight: 600; font-size: 12px; text-transform: uppercase;
       letter-spacing: .06em; }
  .box {
    margin: 22px 0; padding: 14px 16px; border-radius: 14px;
    background: #151327; border: 1px solid #2B2748; font-size: 14px;
  }
  .box.warn { border-color: rgba(245, 181, 68, .45); }
  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid #2B2748;
           font-size: 12px; color: #9C96C4; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>{{TITLE}}</h1>
  <div class="updated">Редакция от {{VERSION}}</div>

  {{BODY}}

  <footer>
    {{OWNER}} · {{EMAIL}}<br>
    Документ относится к телеграм-боту {{BOT}}.
  </footer>
</main>
</body>
</html>
